<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>퀴즈 만들기 — 퀴즈노트</title>
  <meta name="description" content="강의노트를 붙여넣고 난이도·문제 수를 고르면 AI가 문제와 해설을 만들어 드립니다." />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('quiznote-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a href="#main" class="skip-link">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">
        <span class="brand__mark">Q</span>
        <span>퀴즈노트</span>
      </a>

      <div class="nav-right">
        <nav class="nav" id="site-nav" aria-label="주요 메뉴">
          <a href="index.html">홈</a>
          <a href="quiz.html" aria-current="page">퀴즈 만들기</a>
          <a href="guide.html">사용법</a>
          <a href="about.html">소개</a>
        </nav>

        <button type="button" class="icon-btn" data-theme-toggle aria-label="다크 모드로 전환" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>

        <button type="button" class="icon-btn nav-toggle" data-nav-toggle aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-nav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="section--tight">
    <div class="container">
      <h1 style="font-size:clamp(1.5rem,3.5vw,2rem);margin-bottom:4px;">퀴즈 만들기</h1>
      <p style="color:var(--text-muted);margin-bottom:24px;">
        노트를 붙여넣으면 그 내용 안에서만 문제를 만듭니다. 개인정보나 기밀 자료는 넣지 마세요.
      </p>

      <div class="quiz-layout">
        <!-- 입력 패널 -->
        <div class="quiz-form-panel">
          <form id="quiz-form" class="card" novalidate>
            <div class="field">
              <label for="notes">강의노트 <span style="color:var(--danger)">*</span></label>
              <textarea
                id="notes"
                name="notes"
                placeholder="여기에 강의노트나 교재 요약을 붙여넣으세요.&#10;&#10;예) 선점형 스케줄링은 OS가 실행 중인 프로세스에게서 CPU를 강제로 회수할 수 있는 방식이다…"
                aria-describedby="notes-hint counter"
              ></textarea>
              <div class="field__hint" id="notes-hint">30자 이상 8,000자 이하 · 개념 설명이 담긴 부분일수록 좋은 문제가 나옵니다.</div>
              <div class="counter" id="counter" aria-live="polite">0 / 8,000자</div>
            </div>

            <div class="field">
              <label for="difficulty">난이도</label>
              <select id="difficulty" name="difficulty">
                <option value="easy">쉬움 — 용어와 정의 확인</option>
                <option value="normal" selected>보통 — 개념 이해 확인</option>
                <option value="hard">어려움 — 비교·적용·응용</option>
              </select>
            </div>

            <div class="field">
              <label for="count">문제 수</label>
              <select id="count" name="count">
                <option value="3">3개</option>
                <option value="5" selected>5개</option>
                <option value="8">8개</option>
                <option value="10">10개</option>
              </select>
            </div>

            <div class="field">
              <span class="field__label">문제 유형 <span style="color:var(--danger)">*</span></span>
              <div class="check-row">
                <label class="check"><input type="checkbox" name="type" value="multiple" checked /> 객관식</label>
                <label class="check"><input type="checkbox" name="type" value="ox" checked /> OX</label>
                <label class="check"><input type="checkbox" name="type" value="short" checked /> 주관식</label>
              </div>
              <div class="field__hint">최소 하나는 선택해야 합니다.</div>
            </div>

            <button type="submit" class="btn btn--primary btn--block" id="submit-btn">
              <span id="submit-label">퀴즈 생성하기</span>
            </button>

            <div style="display:flex;gap:8px;margin-top:10px;">
              <button type="button" class="btn btn--ghost btn--sm" id="sample-btn" style="flex:1">예시 노트 넣기</button>
              <button type="button" class="btn btn--ghost btn--sm" id="clear-btn" style="flex:1">비우기</button>
            </div>
          </form>
        </div>

        <!-- 결과 패널 -->
        <div>
          <div id="alert-box" aria-live="assertive"></div>
          <div id="result-area"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-year>2026</span> 퀴즈노트(QuizNote) · 학습용 프로젝트</span>
      <span>입력한 노트는 서버에 저장되지 않습니다.</span>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
